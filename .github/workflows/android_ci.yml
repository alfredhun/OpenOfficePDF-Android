name: Android CI Build & 16KB Verification

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Verify Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses & Install NDK/CMake
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Grant Execute Permission to Scripts
        run: |
          chmod +x scripts/verify_16kb_alignment.sh

      - name: Run Unit Tests
        run: |
          gradle test --stacktrace --no-configuration-cache

      - name: Assemble APKs (Debug & Release)
        run: |
          gradle assembleDebug assembleRelease --stacktrace --no-configuration-cache

      - name: Verify 16KB Page Size Alignment
        run: |
          find app/build -name "*.so" -exec bash scripts/verify_16kb_alignment.sh {} +

      - name: Collect Generated APK Artifacts
        run: |
          mkdir -p artifacts
          find app/build -name "*.apk" -exec cp -v {} artifacts/ \; || true
          echo "Collected artifacts:"
          ls -lh artifacts/

      - name: Upload Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-apks
          path: artifacts/*.apk
          if-no-files-found: error
